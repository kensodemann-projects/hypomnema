<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — Hypomnema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Lora:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  body { align-items: stretch; }
  .brand {
    flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 64px;
    background: linear-gradient(150deg, #4A55C8 0%, #2E3694 100%); color: #fff;
  }
  [data-theme="dark"] .brand { background: linear-gradient(150deg, #2B3290 0%, #151A55 100%); }
  .brand img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .brand h1 { font-size: 40px; font-weight: 400; margin-top: 28px; letter-spacing: -.5px; }
  .brand .quote { font-family: 'Lora', Georgia, serif; font-style: italic; font-size: 18px; opacity: .85; max-width: 440px; margin-top: 12px; line-height: 1.5; }
  .form-side { width: 520px; display: flex; align-items: center; justify-content: center; background: var(--surface); }
  .form-box { width: 360px; display: flex; flex-direction: column; gap: 18px; }
  .form-box h2 { font-size: 26px; font-weight: 400; }
</style>
</head>
<body>
  <section class="brand">
    <img src="logo.svg" alt="">
    <h1>Hypomnema</h1>
    <p class="quote">A note kept so it can be found again: a reminder, a memorandum, a short record of something worth remembering.</p>
  </section>

  <section class="form-side">
    <form class="form-box" onsubmit="location.href='dashboard.html';return false;">
      <div>
        <h2>Sign in</h2>
        <div class="muted small">Use the account you were given.</div>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" value="ken@example.com" autocomplete="username">
      </div>
      <div class="field error">
        <label>Password</label>
        <input type="password" value="••••••••" autocomplete="current-password">
        <span class="helper">Incorrect email or password.</span>
      </div>
      <button class="btn btn-filled" type="submit" style="width:100%;padding:12px">Sign In</button>
      <button class="btn btn-text" type="button" style="align-self:center">Forgot password?</button>
      <div class="banner banner-info" style="font-size:12px">
        <span class="material-symbols-outlined">mail</span>
        <span>After <em>Forgot password?</em>, a reset link is sent to the email above if it belongs to an account.</span>
      </div>
    </form>
  </section>
</body>
</html>
